import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

def rootPackage = new JsonSlurper().parse(file('../../package.json'))
def starCompanionVersionName = rootPackage.version as String
def versionParts = starCompanionVersionName.split('[-+]')[0].split('\\.').collect { it as Integer }
def starCompanionVersionCode = versionParts[0] * 1000000 + versionParts[1] * 1000 + versionParts[2]
def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('signing.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def signingValue = { String envName, String propertyName ->
    System.getenv(envName) ?: signingProperties.getProperty(propertyName)
}
def releaseKeystorePath = signingValue('STAR_COMPANION_ANDROID_KEYSTORE_PATH', 'storeFile')
def releaseStorePassword = signingValue('STAR_COMPANION_ANDROID_STORE_PASSWORD', 'storePassword')
def releaseKeyAlias = signingValue('STAR_COMPANION_ANDROID_KEY_ALIAS', 'keyAlias')
def releaseKeyPassword = signingValue('STAR_COMPANION_ANDROID_KEY_PASSWORD', 'keyPassword')
def releaseSigningReady = [releaseKeystorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }
def releaseKeystoreFile = releaseKeystorePath ? (new File(releaseKeystorePath).isAbsolute() ? file(releaseKeystorePath) : rootProject.file(releaseKeystorePath)) : null

android {
    namespace = "local.starcompanion.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "local.starcompanion.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode starCompanionVersionCode
        versionName starCompanionVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile releaseKeystoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "Star-Companion-${variant.versionName}-android-${variant.buildType.name}.apk"
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def requestsRelease = graph.allTasks.any { task ->
        task.path == ':app:assembleRelease' || task.path == ':app:bundleRelease' || task.path == ':app:packageRelease'
    }
    if (requestsRelease && !releaseSigningReady) {
        throw new GradleException('Android release signing is not configured. Set the four STAR_COMPANION_ANDROID_* signing variables or create untracked android/signing.properties.')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
